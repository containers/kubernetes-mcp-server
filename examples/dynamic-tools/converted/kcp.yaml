# kcp_workspace_describe converted from the former in-tree kcp toolset. Maintained by hand.
---
apiVersion: tools.kubernetes-mcp-server.io/v1alpha1
kind: Tool
metadata:
  labels:
    app.kubernetes.io/part-of: kubernetes-mcp-server
    tools.kubernetes-mcp-server.io/source-toolset: kcp
  name: kcp-workspace-describe
spec:
  description: Get detailed information about a specific kcp workspace
  inputSchema:
    properties:
      workspace:
        description: Name or path of the workspace to describe
        type: string
    required:
    - workspace
    type: object
  kubernetes:
    apiVersion: tenancy.kcp.io/v1alpha1
    name:
      argument: workspace
    namespaced: false
    resource: workspaces
    verb: get
  name: kcp_workspace_describe
  readOnly: true
  title: 'kcp: Workspace Describe'
