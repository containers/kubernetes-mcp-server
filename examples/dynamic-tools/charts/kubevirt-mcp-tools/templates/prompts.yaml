      ? ''invalid pipelineVersion: must be in format X.Y.Z (e.g. 0.25.0)'' : '''')'
    name: check
  - expression: 'has(args.windowsVersion) && args.windowsVersion != '''' ? args.windowsVersion
      : ''2k22'''
    name: version
  - fail: '!(steps.version in [''10'', ''11'', ''2k22'', ''2k25'']) ? ''unsupported
      Windows version '' + steps.version + '': must be one of 10, 11, 2k22, 2k25''
      : '''''
    name: supported
  - expression: '{''10'': {''preferenceName'': ''windows.10.virtio'', ''autounattendConfigMapName'':
      ''windows10-efi-autounattend'', ''baseDvName'': ''win10'', ''isoDvName'': ''win10'',
      ''generateName'': ''windows10-installer-run-''}, ''11'': {''preferenceName'':
      ''windows.11.virtio'', ''autounattendConfigMapName'': ''windows11-autounattend'',
