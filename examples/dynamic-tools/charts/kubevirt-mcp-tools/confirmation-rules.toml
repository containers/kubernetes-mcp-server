# Confirmation rules that accompany the KubeVirt tools. Confirmation rules are
# server configuration, not cluster resources: add this file to the server's
# config drop-in directory (--config-dir) or merge it into its TOML.
#
# The Microsoft EULA check. The in-tree server enforces the same rule with a
# compiled-in validator (WindowsEULAValidator); this rule expresses it as
# data so the KubeVirt tooling can ship it.
[[confirmation_rules]]
kind = "PipelineRun"
group = "tekton.dev"
expression = """verb in ['create', 'update', 'patch'] &&
  has(object.spec.pipelineRef) && has(object.spec.pipelineRef.params) &&
  object.spec.pipelineRef.params.exists(p, p.name == 'name' && p.value == 'windows-efi-installer') &&
  !(has(object.spec.params) && object.spec.params.exists(p, p.name == 'acceptEula' && p.value == 'true'))"""
message = "Microsoft EULA Notice: This PipelineRun will create a Windows golden image. By proceeding, you agree to the Microsoft Software License Terms for the Windows operating system. Do you accept the Microsoft End User License Agreement (EULA)?"
