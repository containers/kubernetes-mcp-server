          {''mcp_mode'': ''true''})'
      certificateAuthority: {{ .Values.certificateAuthority | quote }}
      headers:
        X-Kubernetes-MCP-Server: "true"
      insecureSkipTLSVerify: {{ .Values.insecureSkipTLSVerify }}
