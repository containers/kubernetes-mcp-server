kind: Task
apiVersion: mcpchecker/v1alpha2
metadata:
  labels:
    suite: kubevirt
    project: kubevirt
    requires: kubevirt
  annotations:
    project-name: "KubeVirt"
    project-url: "https://kubevirt.io"
  name: "restart-vm-with-run-policy"
  difficulty: medium
spec:
  requires:
    - extension: kubernetes
      as: k8s
  setup:
    - k8s.delete:
        apiVersion: v1
        kind: Namespace
        metadata:
          name: vm-test-restart-policy
        ignoreNotFound: true
    - k8s.create:
        apiVersion: v1
        kind: Namespace
        metadata:
          name: vm-test-restart-policy
    - k8s.create:
        apiVersion: kubevirt.io/v1
        kind: VirtualMachine
        metadata:
          name: config-server-vm
          namespace: vm-test-restart-policy
        spec:
          runStrategy: Always
          template:
            spec:
              domain:
                devices:
                  disks:
                    - name: containerdisk
                      disk:
                        bus: virtio
                memory:
                  guest: 2Gi
              terminationGracePeriodSeconds: 0
              volumes:
                - name: containerdisk
                  containerDisk:
                    image: quay.io/containerdisks/fedora:latest
  verify:
    - script:
        inline: |-
          #!/usr/bin/env bash
          set -e

          NS="vm-test-restart-policy"
          VM="config-server-vm"

          run_strategy=$(kubectl get virtualmachine "$VM" -n "$NS" -o jsonpath='{.spec.runStrategy}')

          if [[ "$run_strategy" != "RerunOnFailure" ]]; then
            echo "ERROR: Expected runStrategy 'RerunOnFailure', got '$run_strategy'"
            kubectl get virtualmachine "$VM" -n "$NS" -o yaml
            exit 1
          fi

          echo "Verification passed: runStrategy is 'RerunOnFailure'"
          exit 0
  cleanup:
    - k8s.delete:
        apiVersion: v1
        kind: Namespace
        metadata:
          name: vm-test-restart-policy
        ignoreNotFound: true
  prompt:
    inline: |-
      A VirtualMachine named config-server-vm is running in the vm-test-restart-policy namespace.
      A configuration change was just applied that requires a reboot to take effect.

      Please restart the VM. After it comes back up, I want it to automatically recover if it
      crashes or the guest panics, but I do NOT want it to restart if I deliberately shut it
      down from inside the guest OS or stop it from the management system.

      Apply both the restart and the new restart behaviour in a single operation.
