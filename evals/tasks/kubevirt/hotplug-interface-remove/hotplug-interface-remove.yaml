kind: Task
apiVersion: mcpchecker/v1alpha2
metadata:
  labels:
    suite: kubevirt
    project: kubevirt
    requires: kubevirt
  annotations:
    project-name: "KubeVirt"
    project-url: "https://kubevirt.io"
  name: "hotplug-interface-remove"
  difficulty: medium
spec:
  requires:
    - extension: kubernetes
      as: k8s
  setup:
    - k8s.delete:
        apiVersion: v1
        kind: Namespace
        metadata:
          name: vm-test-hotplug-nic-rm
        ignoreNotFound: true
    - k8s.create:
        apiVersion: v1
        kind: Namespace
        metadata:
          name: vm-test-hotplug-nic-rm
    - k8s.create:
        apiVersion: k8s.cni.cncf.io/v1
        kind: NetworkAttachmentDefinition
        metadata:
          name: extra-net
          namespace: vm-test-hotplug-nic-rm
        spec:
          config: '{"cniVersion": "0.3.1", "name": "extra-net", "type": "bridge", "bridge": "extra-br", "ipam": {}}'
    - k8s.create:
        apiVersion: kubevirt.io/v1
        kind: VirtualMachine
        metadata:
          name: test-vm
          namespace: vm-test-hotplug-nic-rm
        spec:
          runStrategy: Always
          template:
            spec:
              domain:
                devices:
                  disks:
                    - name: containerdisk
                      disk:
                        bus: virtio
                  interfaces:
                    - name: default
                      masquerade: {}
                    - name: hotplug-nic
                      bridge: {}
                resources:
                  requests:
                    memory: 1Gi
              networks:
                - name: default
                  pod: {}
                - name: hotplug-nic
                  multus:
                    networkName: extra-net
              volumes:
                - name: containerdisk
                  containerDisk:
                    image: quay.io/containerdisks/fedora:latest
    - script:
        inline: |-
          #!/usr/bin/env bash
          kubectl wait --for=jsonpath='{.status.ready}'=true virtualmachine/test-vm -n vm-test-hotplug-nic-rm --timeout=300s
  verify:
    - script:
        inline: |-
          #!/usr/bin/env bash
          source ../helpers/verify-vm.sh
          NS="vm-test-hotplug-nic-rm"

          verify_interface_absent "test-vm" "$NS" "hotplug-nic" || exit 1

          echo "All validations passed"
          exit 0
  cleanup:
    - k8s.delete:
        apiVersion: kubevirt.io/v1
        kind: VirtualMachine
        metadata:
          name: test-vm
          namespace: vm-test-hotplug-nic-rm
        ignoreNotFound: true
    - k8s.delete:
        apiVersion: k8s.cni.cncf.io/v1
        kind: NetworkAttachmentDefinition
        metadata:
          name: extra-net
          namespace: vm-test-hotplug-nic-rm
        ignoreNotFound: true
    - k8s.delete:
        apiVersion: v1
        kind: Namespace
        metadata:
          name: vm-test-hotplug-nic-rm
        ignoreNotFound: true
  prompt:
    inline: Remove the network interface named 'hotplug-nic' from the running VM 'test-vm' in the vm-test-hotplug-nic-rm namespace.
