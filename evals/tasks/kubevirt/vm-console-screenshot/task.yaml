kind: Task
apiVersion: mcpchecker/v1alpha2
metadata:
  labels:
    suite: kubevirt
    project: kubevirt
    requires: kubevirt
  annotations:
    project-name: "KubeVirt"
    project-url: "https://kubevirt.io"
  name: "vm-console-screenshot"
  difficulty: easy
spec:
  requires:
    - extension: kubernetes
      as: k8s
  setup:
    - k8s.delete:
        apiVersion: v1
        kind: Namespace
        metadata:
          name: vm-test-console-screenshot
        ignoreNotFound: true
    - k8s.create:
        apiVersion: v1
        kind: Namespace
        metadata:
          name: vm-test-console-screenshot
    - k8s.create:
        apiVersion: kubevirt.io/v1
        kind: VirtualMachine
        metadata:
          name: test-vm
          namespace: vm-test-console-screenshot
        spec:
          runStrategy: Always
          template:
            spec:
              domain:
                devices:
                  disks:
                    - name: containerdisk
                      disk:
                        bus: virtio
                memory:
                  guest: 2Gi
              terminationGracePeriodSeconds: 0
              volumes:
                - name: containerdisk
                  containerDisk:
                    image: quay.io/containerdisks/fedora:latest
    - k8s.wait:
        apiVersion: kubevirt.io/v1
        kind: VirtualMachine
        metadata:
          name: test-vm
          namespace: vm-test-console-screenshot
        condition: Ready
        timeout: 300s
  verify:
    - script:
        inline: |-
          #!/usr/bin/env bash
          set -e

          NS=vm-test-console-screenshot

          if ! kubectl get vmi test-vm -n "${NS}" &>/dev/null; then
            echo "ERROR: VirtualMachineInstance 'test-vm' not found"
            exit 1
          fi

          PHASE=$(kubectl get vmi test-vm -n "${NS}" -o jsonpath='{.status.phase}')
          if [ "${PHASE}" != "Running" ]; then
            echo "ERROR: VMI is not running (phase: ${PHASE})"
            exit 1
          fi

          # Confirm the VNC screenshot subresource actually returns a PNG image,
          # i.e. the capability the tool exercised is available on this cluster.
          SHOT=$(mktemp)
          trap 'rm -f "${SHOT}"' EXIT
          if ! kubectl get --raw \
            "/apis/subresources.kubevirt.io/v1/namespaces/${NS}/virtualmachineinstances/test-vm/vnc/screenshot" \
            > "${SHOT}" 2>/dev/null; then
            echo "ERROR: the VNC screenshot subresource could not be retrieved"
            exit 1
          fi

          SIZE=$(stat -c%s "${SHOT}")
          if [ "${SIZE}" -eq 0 ]; then
            echo "ERROR: the VNC screenshot subresource returned no data"
            exit 1
          fi

          # PNG magic number: 89 50 4E 47
          if [ "$(head -c 4 "${SHOT}" | od -An -tx1 | tr -d ' \n')" != "89504e47" ]; then
            echo "ERROR: the screenshot is not a PNG image"
            exit 1
          fi

          echo "Verification passed: VM is running and the VNC screenshot subresource returned a ${SIZE} byte PNG"
          exit 0
    - llmJudge:
        contains: "an image of the VM's graphical console was returned by the tool, and the answer describes what is visible on the screen (for example the bootloader, the boot messages, or a login prompt)"
  cleanup:
    - k8s.delete:
        apiVersion: v1
        kind: Namespace
        metadata:
          name: vm-test-console-screenshot
        ignoreNotFound: true
  prompt:
    inline: |
      Take a screenshot of the graphical console for the virtual machine "test-vm" in the vm-test-console-screenshot namespace, so I can see what's currently displayed on its screen.
