kind: Task
apiVersion: mcpchecker/v1alpha2
metadata:
  labels:
    suite: kubevirt
    project: kubevirt
    requires: kubevirt
  annotations:
    project-name: "KubeVirt"
    project-url: "https://kubevirt.io"
  name: "hotplug-volume-remove"
  difficulty: medium
spec:
  requires:
    - extension: kubernetes
      as: k8s
  setup:
    - k8s.delete:
        apiVersion: v1
        kind: Namespace
        metadata:
          name: vm-test-hotplug-vol-rm
        ignoreNotFound: true
    - k8s.create:
        apiVersion: v1
        kind: Namespace
        metadata:
          name: vm-test-hotplug-vol-rm
    - k8s.create:
        apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          name: hotplug-disk
          namespace: vm-test-hotplug-vol-rm
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
    - k8s.create:
        apiVersion: kubevirt.io/v1
        kind: VirtualMachine
        metadata:
          name: test-vm
          namespace: vm-test-hotplug-vol-rm
        spec:
          runStrategy: Always
          template:
            spec:
              domain:
                devices:
                  disks:
                    - name: containerdisk
                      disk:
                        bus: virtio
                    - name: hotplug-vol
                      disk:
                        bus: virtio
                resources:
                  requests:
                    memory: 1Gi
              volumes:
                - name: containerdisk
                  containerDisk:
                    image: quay.io/containerdisks/fedora:latest
                - name: hotplug-vol
                  persistentVolumeClaim:
                    claimName: hotplug-disk
                    hotpluggable: true
    - script:
        inline: |-
          #!/usr/bin/env bash
          kubectl wait --for=jsonpath='{.status.ready}'=true virtualmachine/test-vm -n vm-test-hotplug-vol-rm --timeout=300s
  verify:
    - script:
        inline: |-
          #!/usr/bin/env bash
          source ../helpers/verify-vm.sh
          NS="vm-test-hotplug-vol-rm"

          verify_volume_not_exists "test-vm" "$NS" "hotplug-vol" || exit 1
          verify_disk_not_exists "test-vm" "$NS" "hotplug-vol" || exit 1

          echo "All validations passed"
          exit 0
  cleanup:
    - k8s.delete:
        apiVersion: kubevirt.io/v1
        kind: VirtualMachine
        metadata:
          name: test-vm
          namespace: vm-test-hotplug-vol-rm
        ignoreNotFound: true
    - k8s.delete:
        apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          name: hotplug-disk
          namespace: vm-test-hotplug-vol-rm
        ignoreNotFound: true
    - k8s.delete:
        apiVersion: v1
        kind: Namespace
        metadata:
          name: vm-test-hotplug-vol-rm
        ignoreNotFound: true
  prompt:
    inline: Remove the volume named 'hotplug-vol' from the running VM 'test-vm' in the vm-test-hotplug-vol-rm namespace.
