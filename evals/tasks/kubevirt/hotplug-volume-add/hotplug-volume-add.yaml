kind: Task
apiVersion: mcpchecker/v1alpha2
metadata:
  labels:
    suite: kubevirt-multinode
    project: kubevirt
    requires: kubevirt-multinode
  annotations:
    project-name: "KubeVirt"
    project-url: "https://kubevirt.io"
  name: "hotplug-volume-add"
  difficulty: medium
spec:
  requires:
    - extension: kubernetes
      as: k8s
  setup:
    - k8s.delete:
        apiVersion: v1
        kind: Namespace
        metadata:
          name: vm-test-hotplug-vol-add
        ignoreNotFound: true
    - k8s.create:
        apiVersion: v1
        kind: Namespace
        metadata:
          name: vm-test-hotplug-vol-add
    - k8s.create:
        apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          name: extra-disk
          namespace: vm-test-hotplug-vol-add
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
    - k8s.create:
        apiVersion: kubevirt.io/v1
        kind: VirtualMachine
        metadata:
          name: test-vm
          namespace: vm-test-hotplug-vol-add
        spec:
          runStrategy: Always
          template:
            spec:
              domain:
                devices:
                  disks:
                    - name: containerdisk
                      disk:
                        bus: virtio
                resources:
                  requests:
                    memory: 1Gi
              volumes:
                - name: containerdisk
                  containerDisk:
                    image: quay.io/containerdisks/fedora:latest
    - script:
        inline: |-
          #!/usr/bin/env bash
          kubectl wait --for=jsonpath='{.status.ready}'=true virtualmachine/test-vm -n vm-test-hotplug-vol-add --timeout=300s
  verify:
    - script:
        inline: |-
          #!/usr/bin/env bash
          source ../helpers/verify-vm.sh
          NS="vm-test-hotplug-vol-add"

          verify_volume_exists "test-vm" "$NS" "extra-disk" || exit 1
          verify_volume_hotpluggable "test-vm" "$NS" "extra-disk" || exit 1
          verify_disk_exists "test-vm" "$NS" "extra-disk" || exit 1
          verify_vmi_volume_ready "test-vm" "$NS" "extra-disk" 300 || exit 1

          echo "All validations passed"
          exit 0
  cleanup:
    - k8s.delete:
        apiVersion: kubevirt.io/v1
        kind: VirtualMachine
        metadata:
          name: test-vm
          namespace: vm-test-hotplug-vol-add
        ignoreNotFound: true
    - k8s.delete:
        apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          name: extra-disk
          namespace: vm-test-hotplug-vol-add
        ignoreNotFound: true
    - k8s.delete:
        apiVersion: v1
        kind: Namespace
        metadata:
          name: vm-test-hotplug-vol-add
        ignoreNotFound: true
  prompt:
    inline: Attach the PVC named 'extra-disk' as a new volume to the running VM 'test-vm' in the vm-test-hotplug-vol-add namespace.
