kind: Task
apiVersion: mcpchecker/v1alpha2
metadata:
  labels:
    suite: kubevirt
    project: kubevirt
    requires: kubevirt
  annotations:
    project-name: "KubeVirt"
    project-url: "https://kubevirt.io"
  name: "set-run-strategy-rerun-on-failure"
  difficulty: medium
spec:
  requires:
    - extension: kubernetes
      as: k8s
  setup:
    - k8s.delete:
        apiVersion: v1
        kind: Namespace
        metadata:
          name: vm-test-rerun-on-failure
        ignoreNotFound: true
    - k8s.create:
        apiVersion: v1
        kind: Namespace
        metadata:
          name: vm-test-rerun-on-failure
    - k8s.create:
        apiVersion: kubevirt.io/v1
        kind: VirtualMachine
        metadata:
          name: app-server-vm
          namespace: vm-test-rerun-on-failure
        spec:
          runStrategy: Always
          template:
            spec:
              domain:
                devices:
                  disks:
                    - name: containerdisk
                      disk:
                        bus: virtio
                memory:
                  guest: 2Gi
              terminationGracePeriodSeconds: 0
              volumes:
                - name: containerdisk
                  containerDisk:
                    image: quay.io/containerdisks/fedora:latest
  verify:
    - script:
        inline: |-
          #!/usr/bin/env bash
          set -e

          NS="vm-test-rerun-on-failure"
          VM="app-server-vm"

          run_strategy=$(kubectl get virtualmachine "$VM" -n "$NS" -o jsonpath='{.spec.runStrategy}')

          if [[ "$run_strategy" != "RerunOnFailure" ]]; then
            echo "ERROR: Expected runStrategy 'RerunOnFailure', got '$run_strategy'"
            kubectl get virtualmachine "$VM" -n "$NS" -o yaml
            exit 1
          fi

          echo "Verification passed: runStrategy is 'RerunOnFailure'"
          exit 0
  cleanup:
    - k8s.delete:
        apiVersion: v1
        kind: Namespace
        metadata:
          name: vm-test-rerun-on-failure
        ignoreNotFound: true
  prompt:
    inline: |-
      A VirtualMachine named app-server-vm exists in the vm-test-rerun-on-failure namespace.
      It is currently configured to always restart.

      I need to change its restart behaviour: the VM should automatically recover if it crashes
      or the guest OS panics, but it must NOT restart if I deliberately shut it down from inside
      the guest (for example via "shutdown -h now") or stop it from the management system.

      In other words: self-heal on failure, respect intentional shutdowns.

      Please update the VM's run strategy to match this requirement.
