kind: Task
apiVersion: mcpchecker/v1alpha2

metadata:
  labels:
    suite: guest-observability
    project: kubevirt
    requires: guest-observability
  annotations:
    project-name: "KubeVirt"
    project-url: "https://kubevirt.io"
  name: "windows-event-129-missing-source"
  category: "Guest failure investigation"
  description: "Handle a storage reset whose guest-log source label is missing."
  difficulty: medium

spec:
  requires:
    - extension: kubernetes
      as: k8s

  setup:
    - script:
        inline: |-
          #!/usr/bin/env bash
          set -euo pipefail

          REPO_ROOT="$(git rev-parse --show-toplevel)"

          GUEST_OBSERVABILITY_SCENARIO=event129-missing-source \
            "${REPO_ROOT}/evals/tasks/guest-observability/shared/setup-mock.sh"
        timeout: 180s
  verify:
    - script:
        inline: |-
          #!/usr/bin/env bash
          set -euo pipefail

          REPO_ROOT="$(git rev-parse --show-toplevel)"

          bash "${REPO_ROOT}/evals/tasks/guest-observability/windows-event-129-missing-source/verify.sh"
        timeout: 30s

    - llmJudge:
        contains: "Event 129"

    - llmJudge:
        contains: >-
          The affected VM can be identified as win-event-129 because the
          namespace and vm_name identity labels are present, but source is
          missing. VM attribution remains reliable, while guest log-source
          provenance is incomplete. The response should not invent a source
          label.

  cleanup:
    - script:
        inline: |-
          #!/usr/bin/env bash
          set -euo pipefail

          REPO_ROOT="$(git rev-parse --show-toplevel)"

          bash "${REPO_ROOT}/evals/tasks/guest-observability/shared/cleanup-mock.sh"
        timeout: 180s

  prompt:
    inline: |
      Check whether any Windows VM in the
      guest-observability-eval namespace experienced a storage reset
      during the last hour.
      Identify the affected VM and call out any missing guest telemetry
      contract labels that affect your confidence.
