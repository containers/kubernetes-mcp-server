kind: Task
apiVersion: mcpchecker/v1alpha2

metadata:
  labels:
    suite: guest-observability
    project: kubevirt
    requires: guest-observability
  annotations:
    project-name: "KubeVirt"
    project-url: "https://kubevirt.io"
  name: "windows-event-129-missing-os"
  category: "Guest failure investigation"
  description: "Handle a storage reset whose os classification label is missing."
  difficulty: medium

spec:
  requires:
    - extension: kubernetes
      as: k8s

  setup:
    - script:
        inline: |-
          #!/usr/bin/env bash
          set -euo pipefail

          REPO_ROOT="$(git rev-parse --show-toplevel)"

          GUEST_OBSERVABILITY_SCENARIO=event129-missing-os \
            "${REPO_ROOT}/evals/tasks/guest-observability/shared/setup-mock.sh"
        timeout: 180s
  verify:
    - script:
        inline: |-
          #!/usr/bin/env bash
          set -euo pipefail

          REPO_ROOT="$(git rev-parse --show-toplevel)"

          bash "${REPO_ROOT}/evals/tasks/guest-observability/windows-event-129-missing-os/verify.sh"
        timeout: 30s

    - llmJudge:
        contains: "Event 129"

    - llmJudge:
        contains: >-
          The affected VM can be identified as win-event-129 from its
          namespace and vm_name labels, but the os label is missing.
          source=windows_eventlog still provides explicit Windows
          classification evidence, and the missing os label should be
          reported as a telemetry-contract gap.

  cleanup:
    - script:
        inline: |-
          #!/usr/bin/env bash
          set -euo pipefail

          REPO_ROOT="$(git rev-parse --show-toplevel)"

          bash "${REPO_ROOT}/evals/tasks/guest-observability/shared/cleanup-mock.sh"
        timeout: 180s

  prompt:
    inline: |
      Check whether any Windows VM in the
      guest-observability-eval namespace experienced a storage reset
      during the last hour.
      Identify the affected VM and call out any missing guest telemetry
      contract labels that affect your confidence.
