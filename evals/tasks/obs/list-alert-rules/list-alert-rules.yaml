kind: Task
apiVersion: mcpchecker/v1alpha2
metadata:
  name: "list-alert-rules"
  difficulty: easy
  parallel: true
  runs: 1
  labels:
    category: alerts
    suite: obs
    requires: alert-management
    toolType: alert-management
  description: |
    Tests if the agent can discover and use list_alert_rules to retrieve
    OpenShift alert rule definitions (not firing instances). Requires
    --toolsets to include observability/alert-management and a reachable
    monitoring-plugin management API.
spec:
  verify:
    - llmJudge:
        contains: "rule"
  prompt:
    inline: |
      List the OpenShift alert rules. Use list_alert_rules, not get_alerts.
      Summarize a few rule names you found.
