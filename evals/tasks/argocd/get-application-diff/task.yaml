kind: Task
apiVersion: mcpchecker/v1alpha2
metadata:
  name: "get-argocd-application-diff"
  difficulty: medium
  labels:
    suite: argocd
    requires: argocd
spec:
  requires:
    - extension: kubernetes
      as: k8s

  setup:
    - k8s.delete:
        apiVersion: v1
        kind: Namespace
        metadata:
          name: argocd-eval-get-app-diff
        ignoreNotFound: true
    - k8s.create:
        apiVersion: v1
        kind: Namespace
        metadata:
          name: argocd-eval-get-app-diff
    - k8s.create:
        apiVersion: argoproj.io/v1alpha1
        kind: Application
        metadata:
          name: app-web
          namespace: argocd-eval-get-app-diff
        spec:
          project: default
          source:
            repoURL: https://github.com/example/web-app
            targetRevision: main
            path: k8s
          destination:
            server: https://kubernetes.default.svc
            namespace: default

  verify:
    - script:
        inline: |-
          #!/usr/bin/env bash
          set -e
          kubectl get application app-web -n argocd-eval-get-app-diff -o name || { echo "ERROR: Application app-web not found"; exit 1; }
          echo "Application app-web exists (agent should have found it but not its diff)"
    - llmJudge:
        contains: "app-web"
    - llmJudge:
        contains: "ArgoCD"

  cleanup:
    - k8s.delete:
        apiVersion: argoproj.io/v1alpha1
        kind: Application
        metadata:
          name: app-web
          namespace: argocd-eval-get-app-diff
        ignoreNotFound: true
    - k8s.delete:
        apiVersion: v1
        kind: Namespace
        metadata:
          name: argocd-eval-get-app-diff
        ignoreNotFound: true

  prompt:
    inline: Get the diff (live vs desired state) for the ArgoCD Application named app-web in the argocd-eval-get-app-diff namespace. Show me what resources differ between the live cluster state and the desired state defined in Git.
