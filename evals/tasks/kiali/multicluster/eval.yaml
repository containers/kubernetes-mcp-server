kind: Eval
metadata:
  name: "kiali-multicluster"
config:
  defaultTaskLimits:
    timeout: 15m
    cleanupTimeout: 2m
  agent:
    type: "file"
    path: ../../../core-eval-testing/builtin-openai/agent.yaml
  mcpConfigFile: ../../../mcp-config.yaml
  extensions:
    kubernetes:
      package: https://github.com/mcpchecker/kubernetes-extension@v0.0.4
  llmJudge:
    ref:
      type: file
      path: ../../../core-eval-testing/builtin-openai/agent.yaml
  taskSets:
    - glob: "*/*.yaml"
      labelSelector:
        suite: kiali
        multicluster: "true"
      assertions:
        toolsUsed:
          - server: kubernetes
            toolPattern: ".*"
        minToolCalls: 1
        maxToolCalls: 20
