kind: Eval
metadata:
  name: "core-readonly-e2e"
config:
  agent:
    type: "file"
    path: agent.yaml
  mcpConfigFile: ../../mcp-config.yaml
  extensions:
    kubernetes:
      package: https://github.com/mcpchecker/kubernetes-extension@v0.0.4
  llmJudge:
    ref:
      type: file
      path: agent.yaml
  taskSets:
    - glob: ../../tasks/*/*/*.yaml
      labelSelector:
        readonly: "true"
      assertions:
        toolsUsed:
          - server: kubernetes
            toolPattern: ".*"
        toolsNotUsed:
          - server: kubernetes
            toolPattern: "(resources_create_or_update|resources_delete|resources_scale|pods_delete|pods_exec|pods_run)"
        minToolCalls: 1
        maxToolCalls: 15
