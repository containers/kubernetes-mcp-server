name: E2E Tests

on:
  pull_request:
    branches: ['main']
  merge_group:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yaml

  e2e:
    name: Run E2E Tests
    needs: changes
    if: ${{ needs.changes.outputs.run_e2e_conformance_browser == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: go.mod

      - name: Setup e2e environment
        run: make e2e-full-setup

      - name: Run e2e tests
        run: make e2e-test

      - name: Cleanup
        if: always()
        run: make e2e-teardown

  gate:
    name: E2E gate
    if: ${{ always() }}
    needs: [changes, e2e]
    runs-on: ubuntu-latest
    env:
      DETECTION: ${{ needs.changes.result }}
      REQUIRED: ${{ needs.changes.outputs.run_e2e_conformance_browser }}
      RESULT: ${{ needs.e2e.result }}
    steps:
      - name: Enforce E2E result
        run: |
          [[ "$DETECTION" == success ]] || exit 1
          case "$REQUIRED" in
            true) [[ "$RESULT" == success ]] ;;
            false) [[ "$RESULT" == skipped ]] ;;
            *) exit 1 ;;
          esac
