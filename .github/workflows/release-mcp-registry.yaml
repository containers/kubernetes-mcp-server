name: Publish to MCP Registry

on:
  # Publishing must follow the complete Release workflow. The job checks upstream
  # success, event and repository, then verifies the tag against the checkout SHA.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g., v0.0.51)'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write   # Required for OIDC authentication to MCP Registry
  contents: read    # Required for checkout (read-only, no write access)

jobs:
  publish:
    name: Publish to MCP Registry
    # Only act on this repository's own tag-push releases (or a manual dispatch).
    if: >-
      github.repository == 'containers/kubernetes-mcp-server' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Automatic runs use the Release commit; manual runs resolve only tags.
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.event.workflow_run.head_sha }}
          # Prevent token persistence to reduce attack surface (security best practice)
          persist-credentials: false

      - name: Validate release tag and get version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$HEAD_BRANCH"
          fi
          # Accept only release tags, never a branch or an arbitrary revision.
          if [[ "$TAG" != v?* ]] || ! git check-ref-format "refs/tags/$TAG"; then
            echo "Expected a valid v-prefixed release tag" >&2
            exit 1
          fi
          # Peel annotated tags and fail if the tag has moved away from the
          # Release commit (or the tag commit checked out for a manual dispatch).
          git fetch --no-tags --depth=1 origin "refs/tags/$TAG"
          TAG_COMMIT=$(git rev-parse --verify 'FETCH_HEAD^{commit}')
          if [ "$TAG_COMMIT" != "$(git rev-parse HEAD)" ]; then
            echo "Release tag does not match the checked-out commit" >&2
            exit 1
          fi
          # Strip the v prefix
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Update server.json version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          jq --arg v "$VERSION" \
            '.version = $v | .packages[] |= if .registryType == "oci" then .identifier = (.identifier | sub(":[^:]+$"; ":v" + $v)) else .version = $v end' \
            server.json > server.json.tmp && mv server.json.tmp server.json
          echo "Updated server.json:"
          cat server.json

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
