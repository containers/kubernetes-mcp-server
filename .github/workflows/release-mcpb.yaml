name: Publish MCPB Bundles

on:
  # Bundles require the binaries published by Release. The job checks upstream
  # success, event and repository, then verifies the tag against the checkout SHA.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g., v0.0.51)'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  contents: write  # Required to upload assets to the GitHub release

jobs:
  mcpb:
    name: Publish MCPB Bundles
    # Only act on this repository's own tag-push releases (or a manual dispatch).
    if: >-
      github.repository == 'containers/kubernetes-mcp-server' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: darwin
            arch: arm64
            go_arch: arm64
            binary_suffix: ""
          - os: darwin
            arch: x64
            go_arch: amd64
            binary_suffix: ""
          - os: linux
            arch: arm64
            go_arch: arm64
            binary_suffix: ""
          - os: linux
            arch: x64
            go_arch: amd64
            binary_suffix: ""
          - os: windows
            arch: arm64
            go_arch: arm64
            binary_suffix: ".exe"
          - os: windows
            arch: x64
            go_arch: amd64
            binary_suffix: ".exe"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Automatic runs use the Release commit; manual runs resolve only tags.
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Validate release tag and get version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$HEAD_BRANCH"
          fi
          # Accept only release tags, never a branch or an arbitrary revision.
          if [[ "$TAG" != v?* ]] || ! git check-ref-format "refs/tags/$TAG"; then
            echo "Expected a valid v-prefixed release tag" >&2
            exit 1
          fi
          # Peel annotated tags and fail if the tag has moved away from the
          # Release commit (or the tag commit checked out for a manual dispatch).
          git fetch --no-tags --depth=1 origin "refs/tags/$TAG"
          TAG_COMMIT=$(git rev-parse --verify 'FETCH_HEAD^{commit}')
          if [ "$TAG_COMMIT" != "$(git rev-parse HEAD)" ]; then
            echo "Release tag does not match the checked-out commit" >&2
            exit 1
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          # Strip the v prefix
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Download binary from GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          BINARY_NAME: kubernetes-mcp-server-${{ matrix.os }}-${{ matrix.go_arch }}${{ matrix.binary_suffix }}
        run: |
          gh release download "$TAG" --pattern "$BINARY_NAME" --dir bundle

      - name: Prepare bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
          OS: ${{ matrix.os }}
          BINARY_SUFFIX: ${{ matrix.binary_suffix }}
          BINARY_NAME: kubernetes-mcp-server-${{ matrix.os }}-${{ matrix.go_arch }}${{ matrix.binary_suffix }}
        run: |
          # Map Go OS names to MCPB platform names
          MCPB_PLATFORM="$OS"
          if [ "$OS" = "windows" ]; then
            MCPB_PLATFORM="win32"
          fi
          # Update manifest.json with the release version and platform
          ENTRY_POINT="kubernetes-mcp-server${BINARY_SUFFIX}"
          jq --arg v "$VERSION" --arg p "$MCPB_PLATFORM" --arg ep "$ENTRY_POINT" --arg cmd "\${__dirname}/$ENTRY_POINT" \
            '.version = $v | .compatibility.platforms = [$p] | .server.entry_point = $ep | .server.mcp_config.command = $cmd' \
            manifest.json > bundle/manifest.json
          # Rename binary to match the entry_point in manifest.json
          mv "bundle/$BINARY_NAME" "bundle/$ENTRY_POINT"
          chmod +x "bundle/$ENTRY_POINT"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Pack MCPB bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
        run: |
          npx --yes @anthropic-ai/mcpb pack bundle "kubernetes-mcp-server-${VERSION}-${OS}-${ARCH}.mcpb"

      - name: Upload MCPB bundle to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
        run: |
          gh release upload "$TAG" "kubernetes-mcp-server-${VERSION}-${OS}-${ARCH}.mcpb" --clobber
