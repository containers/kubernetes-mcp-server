name: Release as container image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

env:
  QUAY_IMAGE_NAME: quay.io/containers/kubernetes_mcp_server
  GHCR_IMAGE_NAME: ghcr.io/containers/kubernetes-mcp-server
  TAG: ${{ github.ref_name == 'main' && 'latest' || github.ref_type == 'tag' && github.ref_name && startsWith(github.ref_name, 'v') && github.ref_name || 'unknown' }}

permissions: {}

jobs:
  publish-platform-images:
    name: 'Publish: linux-${{ matrix.platform.tag }}'
    permissions:
      contents: read
      packages: write
    if: github.repository == 'containers/kubernetes-mcp-server'
    strategy:
      fail-fast: true
      matrix:
        platform:
          - runner: ubuntu-latest
            tag: amd64
          - runner: ubuntu-24.04-arm
            tag: arm64
          - runner: ubuntu-latest
            tag: s390x
          - runner: ubuntu-latest
            tag: ppc64le
    runs-on: ${{ matrix.platform.runner }}
    env:
      PLATFORM_TAG: ${{ matrix.platform.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Podman # Not available in arm64 image
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
      - name: Quay Login
        env:
          REGISTRY_USER: ${{ secrets.QUAY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: |
          printf '%s\n' "$REGISTRY_PASSWORD" | podman login quay.io -u "$REGISTRY_USER" --password-stdin
      - name: GHCR Login
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' "$REGISTRY_PASSWORD" | podman login ghcr.io -u "$REGISTRY_USER" --password-stdin
      - name: Build Image
        run: |
          podman build \
            --platform "linux/${PLATFORM_TAG}" \
            -f Dockerfile \
            -t "${QUAY_IMAGE_NAME}:${TAG}-linux-${PLATFORM_TAG}" \
            -t "${GHCR_IMAGE_NAME}:${TAG}-linux-${PLATFORM_TAG}" \
            .
      - name: Push Image to Quay
        run: |
          podman push \
            "${QUAY_IMAGE_NAME}:${TAG}-linux-${PLATFORM_TAG}"
      - name: Push Image to GHCR
        run: |
          podman push \
            "${GHCR_IMAGE_NAME}:${TAG}-linux-${PLATFORM_TAG}"

  publish-manifest:
    name: Publish Manifest
    permissions:
      packages: write
    if: github.repository == 'containers/kubernetes-mcp-server'
    runs-on: ubuntu-latest
    needs: publish-platform-images
    steps:
      - name: Quay Login
        env:
          REGISTRY_USER: ${{ secrets.QUAY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: |
          printf '%s\n' "$REGISTRY_PASSWORD" | podman login quay.io -u "$REGISTRY_USER" --password-stdin
      - name: GHCR Login
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' "$REGISTRY_PASSWORD" | podman login ghcr.io -u "$REGISTRY_USER" --password-stdin
      - name: Create and Push Quay Manifest
        run: |
          podman manifest create \
            "${QUAY_IMAGE_NAME}:${TAG}" \
            "${QUAY_IMAGE_NAME}:${TAG}-linux-amd64" \
            "${QUAY_IMAGE_NAME}:${TAG}-linux-arm64" \
            "${QUAY_IMAGE_NAME}:${TAG}-linux-s390x" \
            "${QUAY_IMAGE_NAME}:${TAG}-linux-ppc64le"
          podman manifest push \
            "${QUAY_IMAGE_NAME}:${TAG}"
      - name: Create and Push GHCR Manifest
        run: |
          podman manifest create \
            "${GHCR_IMAGE_NAME}:${TAG}" \
            "${GHCR_IMAGE_NAME}:${TAG}-linux-amd64" \
            "${GHCR_IMAGE_NAME}:${TAG}-linux-arm64" \
            "${GHCR_IMAGE_NAME}:${TAG}-linux-s390x" \
            "${GHCR_IMAGE_NAME}:${TAG}-linux-ppc64le"
          podman manifest push \
            "${GHCR_IMAGE_NAME}:${TAG}"
