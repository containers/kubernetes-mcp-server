name: Helm Chart Validation

on:
  push:
    branches:
      - 'main'
    paths:
      - 'charts/**'
      - 'build/helm.mk'
      - '.github/workflows/helm.yaml'
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Helm Chart
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: '3.19.2'

      - name: Lint chart
        run: make helm-lint

      - name: Validate chart templates
        run: make helm-validate

  check-helm-docs:
    name: Check Helm Docs are up-to-date
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate Helm docs
        run: make helm-docs

      - name: Check for uncommitted changes
        run: |
          if ! git diff --quiet charts/kubernetes-mcp-server/README.md; then
            echo "::error::Helm chart README.md is out of date. Please run 'make helm-docs' and commit the changes."
            git diff charts/kubernetes-mcp-server/README.md
            exit 1
          fi
