name: Build

on:
  push:
    branches:
      - 'main'
  pull_request:
  merge_group:

permissions:
  contents: read
  pull-requests: read

concurrency:
  # Only run once for latest commit per ref and cancel other (previous) runs.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yaml

  check-format:
    name: Check formatting
    needs: changes
    if: ${{ needs.changes.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run make format
        run: make format
      - name: Check for uncommitted changes
        run: |
          if ! git diff --quiet; then
            echo "::error::Code is not formatted. Please run 'go fmt ./...' and commit the changes."
            git diff
            exit 1
          fi

  check-readme:
    name: Check README is up-to-date
    needs: changes
    if: ${{ needs.changes.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Update README tools
        run: make update-readme-tools
      - name: Check for uncommitted changes
        run: |
          if ! git diff --quiet README.md docs/configuration.md; then
            echo "::error::README.md or docs/configuration.md is out of date. Please run 'make update-readme-tools' and commit the changes."
            git diff README.md docs/configuration.md
            exit 1
          fi

  check-codeowners:
    name: Check CODEOWNERS is up-to-date
    needs: changes
    if: ${{ needs.changes.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Validate ownership and check CODEOWNERS
        run: make check-codeowners

  build:
    needs: [changes, check-format, check-readme, check-codeowners]
    if: ${{ needs.changes.outputs.build == 'true' }}
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest #x64
          - ubuntu-24.04-arm #arm64
          - windows-latest #x64
          - macos-15-intel #x64
          - macos-latest #arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: make build
      - name: Test
        run: make test

  cross-compile:
    needs: [changes, check-format, check-readme, check-codeowners]
    if: ${{ needs.changes.outputs.build == 'true' }}
    name: Cross-compile for linux/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch:
          - s390x
          - ppc64le
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: make build-multiarch TARGETOS=linux TARGETARCH=${{ matrix.goarch }}

  gate:
    name: Build gate
    if: ${{ always() }}
    needs: [changes, check-format, check-readme, check-codeowners, build, cross-compile]
    runs-on: ubuntu-latest
    env:
      DETECTION: ${{ needs.changes.result }}
      REQUIRED: ${{ needs.changes.outputs.build }}
      FORMAT: ${{ needs.check-format.result }}
      README: ${{ needs.check-readme.result }}
      CODEOWNERS: ${{ needs.check-codeowners.result }}
      BUILD: ${{ needs.build.result }}
      CROSS_COMPILE: ${{ needs.cross-compile.result }}
    steps:
      - name: Enforce build results
        run: |
          [[ "$DETECTION" == success ]] || exit 1
          case "$REQUIRED" in
            true) expected=success ;;
            false) expected=skipped ;;
            *) exit 1 ;;
          esac
          for result in "$FORMAT" "$README" "$CODEOWNERS" "$BUILD" "$CROSS_COMPILE"; do
            if [[ "$result" != "$expected" ]]; then
              echo "::error::Expected $expected but found $result"
              exit 1
            fi
          done
