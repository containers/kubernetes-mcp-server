name: Browser Tests

on:
  pull_request:
    branches: ['main']
  merge_group:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yaml

  browser-test:
    name: Run browser tests
    needs: changes
    if: ${{ needs.changes.outputs.run_e2e_conformance_browser == 'true' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Create test cluster
        run: make minikube-create-cluster

      - name: Run browser tests
        run: KUBECONFIG="$PWD/_output/kubeconfig" make browser-test

      - name: Cleanup
        if: always()
        run: make minikube-delete-cluster

  # Browser failures remain advisory because browser-test uses continue-on-error.
  gate:
    name: Browser scheduling gate
    if: ${{ always() }}
    needs: [changes, browser-test]
    runs-on: ubuntu-latest
    env:
      DETECTION: ${{ needs.changes.result }}
      REQUIRED: ${{ needs.changes.outputs.run_e2e_conformance_browser }}
      RESULT: ${{ needs.browser-test.result }}
    steps:
      - name: Check browser scheduling
        run: |
          [[ "$DETECTION" == success ]] || exit 1
          case "$REQUIRED" in
            true) [[ "$RESULT" == success ]] ;;
            false) [[ "$RESULT" == skipped ]] ;;
            *) exit 1 ;;
          esac
