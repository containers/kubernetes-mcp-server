# Tool resources of the Tempo chart. Converted by hand from the in-tree observability/traces toolset.
{{- $instanceArgs := dict
  "tempoNamespace" "Namespace of the Tempo instance, as listed by tempo_instances."
  "tempoName" "Name of the Tempo instance, as listed by tempo_instances."
  "tenant" "Tenant to query, as listed by tempo_instances; required on a multi-tenant instance." }}
---
apiVersion: tools.kubernetes-mcp-server.io/v1alpha1
kind: Tool
metadata:
  labels:
    app.kubernetes.io/part-of: kubernetes-mcp-server
  name: tempo-instances
spec:
  toolset: tempo
  examples:
    - summary: "Which Tempo instances and tenants are there"
      arguments: {}
  title: 'Tempo: Instances'
  description: >-
    List the Tempo instances of the cluster (TempoStack and TempoMonolithic) with their tenants and status. Call it first: every other Tempo tool takes the tempoNamespace, tempoName and tenant it returns.
  readOnly: true
  idempotent: true
  inputSchema:
    type: object
  steps:
    - name: stacks
      kubernetes:
        verb: list
        apiVersion: tempo.grafana.com/v1alpha1
        kind: TempoStack
        namespace: {all: true}
    - name: monolithics
      kubernetes:
        verb: list
        apiVersion: tempo.grafana.com/v1alpha1
        kind: TempoMonolithic
        namespace: {all: true}
  output: >-
    {'instances': steps.stacks.items.map(t, {{ include "tempo.stackInstance" "t" }}.transformMapEntry(k, v, k == 'service' ? {} : {k: v}))
      + steps.monolithics.items.map(t, {{ include "tempo.monolithicInstance" "t" }}.transformMapEntry(k, v, k == 'service' ? {} : {k: v}))}
---
apiVersion: tools.kubernetes-mcp-server.io/v1alpha1
kind: Tool
metadata:
  labels:
    app.kubernetes.io/part-of: kubernetes-mcp-server
  name: tempo-trace
spec:
  toolset: tempo
  examples:
    - summary: "One trace by id"
      arguments: {"tempoNamespace": "openshift-tracing", "tempoName": "simplest", "tenant": "dev", "traceId": "26dad4a0e2b0dd9a440dd5ff203a24a4"}
  title: 'Tempo: Trace'
  description: >-
    Fetch one distributed trace by its id: every span with its service, operation, duration and attributes. Use it with an id from tempo_search or from a log line; start and end narrow the search and make it faster.
  readOnly: true
  idempotent: true
  inputSchema:
    type: object
    required: [tempoNamespace, tempoName, traceId]
    properties:
{{- range $name, $description := $instanceArgs }}
      {{ $name }}:
        type: string
        description: {{ $description | quote }}
{{- end }}
      traceId:
        type: string
        description: >-
          Id of the trace, e.g. 26dad4a0e2b0dd9a440dd5ff203a24a4.
      start:
        type: string
      end:
        type: string
  steps:
    - name: check
      fail: >-
        !(has(args.traceId) && args.traceId != '') ? 'traceId parameter must not be empty' : {{ include "tempo.timeCheck" . }}
    {{- include "tempo.resolve" . | nindent 4 }}
    - name: trace
      http:
        {{- include "tempo.http" . | nindent 8 }}
        path:
          expression: >-
            {{ include "tempo.prefix" . }} + '/api/v2/traces/' + args.traceId
        query:
          start: {expression: "{{ include "tempo.optionalTime" "start" }}"}
          end: {expression: "{{ include "tempo.optionalTime" "end" }}"}
    - name: exists
      fail: "(type(steps.trace) != map || !has(steps.trace.trace) || steps.trace.trace == null) ? 'trace ' + args.traceId + ' not found' : ''"
  output: steps.trace
---
apiVersion: tools.kubernetes-mcp-server.io/v1alpha1
kind: Tool
metadata:
  labels:
    app.kubernetes.io/part-of: kubernetes-mcp-server
  name: tempo-search
spec:
  toolset: tempo
  examples:
    - summary: "Slow requests of a service in the last hour"
      arguments: {"tempoNamespace": "openshift-tracing", "tempoName": "simplest", "tenant": "dev", "query": "{ resource.service.name=\"checkout\" && duration > 500ms }", "start": "NOW-1h", "end": "NOW", "limit": 20}
  title: 'Tempo: Search'
  description: >-
    Search traces with a TraceQL query: by service, Kubernetes resource, HTTP status, duration, error status or any span or resource attribute (the language is in the tempo instructions). Returns the matching traces with their id, root service and duration; read one with tempo_trace. Give start and end to search a full window; without them only recent data is searched.
  readOnly: true
  idempotent: true
  inputSchema:
    type: object
    required: [tempoNamespace, tempoName, query]
    properties:
{{- range $name, $description := $instanceArgs }}
      {{ $name }}:
        type: string
        description: {{ $description | quote }}
{{- end }}
      query:
        type: string
        description: >-
          TraceQL query, e.g. '{ resource.service.name="frontend" }', '{ resource.k8s.deployment.name="checkout" && span.http.response.status_code>=500 }' or '{ status=error && duration>2s }'.
      limit:
        type: integer
        description: >-
          Maximum number of traces (default: the server's limit).
      start:
        type: string
      end:
        type: string
      spansPerTrace:
        type: integer
        description: >-
          Maximum number of matching spans returned per trace.
  steps:
    - name: check
      fail: >-
        !(has(args.query) && args.query != '') ? 'query parameter must not be empty'
        : (has(args.limit) && int(args.limit) < 0) ? 'invalid limit: must be non-negative'
        : (has(args.limit) && int(args.limit) > 1000) ? 'requested search results limit ' + string(int(args.limit)) + ' is greater than max limit 1000'
        : (has(args.spansPerTrace) && int(args.spansPerTrace) < 0) ? 'invalid spss: must be non-negative'
        : (has(args.spansPerTrace) && int(args.spansPerTrace) > 100) ? 'requested spss limit ' + string(int(args.spansPerTrace)) + ' is greater than max limit 100'
        : {{ include "tempo.timeCheck" . }}
    {{- include "tempo.resolve" . | nindent 4 }}
    - name: search
      http:
        {{- include "tempo.http" . | nindent 8 }}
        path:
          expression: >-
            {{ include "tempo.prefix" . }} + '/api/search'
        query:
          q: {argument: query}
          limit: {expression: "(has(args.limit) && int(args.limit) != 0) ? dyn(int(args.limit)) : dyn(null)"}
          spss: {expression: "(has(args.spansPerTrace) && int(args.spansPerTrace) != 0) ? dyn(int(args.spansPerTrace)) : dyn(null)"}
          start: {expression: "{{ include "tempo.optionalTime" "start" }}"}
          end: {expression: "{{ include "tempo.optionalTime" "end" }}"}
---
apiVersion: tools.kubernetes-mcp-server.io/v1alpha1
kind: Tool
metadata:
  labels:
    app.kubernetes.io/part-of: kubernetes-mcp-server
  name: tempo-tags
spec:
  toolset: tempo
  examples:
    - summary: "Resource-level tag names"
      arguments: {"tempoNamespace": "openshift-tracing", "tempoName": "simplest", "tenant": "dev", "scope": "resource"}
    - summary: "Known service names"
      arguments: {"tempoNamespace": "openshift-tracing", "tempoName": "simplest", "tenant": "dev", "tag": "resource.service.name"}
  title: 'Tempo: Tags'
  description: |-
    List the tag names (attribute keys) Tempo knows, grouped by scope, or, with tag, the known values of one tag.
    Use it to discover what a TraceQL query for tempo_search can filter on: names first (for example "service.name" in the "resource" scope, "http.response.status_code" in the "span" scope), then the values of the tags you want to match (all service names, all HTTP methods).
    In TraceQL, prefix a tag with its scope: "resource.service.name", "span.http.response.status_code"; tag takes that fully qualified form.
  readOnly: true
  idempotent: true
  inputSchema:
    type: object
    required: [tempoNamespace, tempoName]
    properties:
{{- range $name, $description := $instanceArgs }}
      {{ $name }}:
        type: string
        description: {{ $description | quote }}
{{- end }}
      tag:
        type: string
        description: |-
          A fully qualified tag name, scope prefix included (e.g. "resource.service.name"), to list the values of. Omit it to list the tag names.
      scope:
        type: string
        enum: [resource, span, intrinsic]
        description: |-
          Only the tag names of one scope: "resource" (service-level attributes like service.name),
          "span" (individual span attributes like http.response.status_code),
          "intrinsic" (built-in fields like duration, status, name). Ignored when tag is given.
      query:
        type: string
        description: |-
          Optional TraceQL query that narrows which traces are considered,
          e.g. '{ resource.service.name="payment-service" }' to only show what appears in traces from the 'payment-service' service.
      start:
        type: string
      end:
        type: string
      limit:
        type: integer
        description: Maximum number of tag names to return per scope (at most 500), or of values to return (at most 1000).
      maxStaleValues:
        type: integer
        description: Maximum number of consecutive blocks without new names or values before the search stops early. Higher values are more thorough but slower.
  steps:
    - name: check
      fail: >-
        (has(args.limit) && int(args.limit) < 0) ? 'invalid limit: must be non-negative'
        : (has(args.tag) && args.tag != '' && has(args.limit) && int(args.limit) > 1000) ? 'requested tag values limit ' + string(int(args.limit)) + ' is greater than max limit 1000'
        : (!(has(args.tag) && args.tag != '') && has(args.limit) && int(args.limit) > 500) ? 'requested tag names limit ' + string(int(args.limit)) + ' is greater than max limit 500'
        : (has(args.maxStaleValues) && int(args.maxStaleValues) < 0) ? 'invalid maxStaleValues: must be non-negative'
        : {{ include "tempo.timeCheck" . }}
    {{- include "tempo.resolve" . | nindent 4 }}
    - name: tags
      http:
        {{- include "tempo.http" . | nindent 8 }}
        path:
          expression: >-
            {{ include "tempo.prefix" . }} + ((has(args.tag) && args.tag != '') ? '/api/v2/search/tag/' + args.tag + '/values' : '/api/v2/search/tags')
        query:
          scope: {expression: "(has(args.tag) && args.tag != '') ? '' : (has(args.scope) ? args.scope : '')"}
          q: {argument: query}
          limit: {expression: "(has(args.limit) && int(args.limit) != 0) ? dyn(int(args.limit)) : dyn(null)"}
          maxStaleValues: {expression: "(has(args.maxStaleValues) && int(args.maxStaleValues) != 0) ? dyn(int(args.maxStaleValues)) : dyn(null)"}
          start: {expression: "{{ include "tempo.optionalTime" "start" }}"}
          end: {expression: "{{ include "tempo.optionalTime" "end" }}"}
