# Base URL of the Kiali API. The MCP server calls it with the caller's bearer
# token, exactly as the in-tree kiali toolset does ([toolset_configs.kiali] url).
url: https://kiali.istio-system.svc:20001/kiali
# PEM bundle used to verify the Kiali server certificate (empty: system roots).
certificateAuthority: ""
insecureSkipTLSVerify: false

# Labels added to every Tool, Prompt and ToolSet the chart renders. Use them
# with the server's dynamic_tools_selector to say which installs a server
# serves (see charts/dynamic-tools/README.md).
extraLabels: {}
