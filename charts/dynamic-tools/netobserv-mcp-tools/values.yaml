# Base URL of the NetObserv console plugin backend. The MCP server calls it
# with the caller's bearer token ([toolset_configs.netobserv] url).
url: https://netobserv-plugin.netobserv.svc:9001
# PEM bundle used to verify the plugin certificate (empty: system roots).
certificateAuthority: ""
insecureSkipTLSVerify: false

# Labels added to every Tool, Prompt and ToolSet the chart renders. Use them
# with the server's dynamic_tools_selector to say which installs a server
# serves (see charts/dynamic-tools/README.md).
extraLabels: {}
