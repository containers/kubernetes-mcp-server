# Tool custom resource definition for the kubernetes-mcp-server "dynamic" toolset.
#
# A Tool declares an MCP tool (name, description, input schema, annotations) and
# exactly one action the server performs with the caller's own identity:
# a single Kubernetes API request, or an HTTP request to a URL or an in-cluster
# Service. See docs/specs/dynamic-tools.md.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tools.tools.kubernetes-mcp-server.io
spec:
  group: tools.kubernetes-mcp-server.io
  scope: Cluster
  names:
    plural: tools
    singular: tool
    kind: Tool
    shortNames: [mcptool]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Reason
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].reason
        - name: Tool
          type: string
          jsonPath: .status.name
        - name: Read-only
          type: boolean
          jsonPath: .spec.readOnly
        - name: Destructive
          type: boolean
          jsonPath: .spec.destructive
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            status:
              type: object
              description: "Written by the server: the MCP name the resource is exposed as, and a Ready condition saying what it did with the resource and why."
              properties:
                name:
                  type: string
                  description: The MCP name the resource is exposed as, when it is.
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type: {type: string}
                      status: {type: string, enum: ["True", "False", "Unknown"]}
                      reason: {type: string}
                      message: {type: string}
                      observedGeneration: {type: integer}
                      lastTransitionTime: {type: string}
            spec:
              type: object
              required: [description]
              x-kubernetes-validations:
                - rule: "[has(self.kubernetes), has(self.http), has(self.steps), has(self.variants)].filter(x, x).size() == 1"
                  message: "exactly one of spec.kubernetes, spec.http, spec.steps or spec.variants must be set"
                - rule: "!(has(self.readOnly) && self.readOnly) || !((has(self.kubernetes) && self.kubernetes.verb in ['create', 'update', 'patch', 'delete']) || (has(self.steps) && self.steps.exists(s, has(s.kubernetes) && s.kubernetes.verb in ['create', 'update', 'patch', 'delete'])) || (has(self.variants) && self.variants.options.exists(k, o, (has(o.kubernetes) && o.kubernetes.verb in ['create', 'update', 'patch', 'delete']) || (has(o.steps) && o.steps.exists(s, has(s.kubernetes) && s.kubernetes.verb in ['create', 'update', 'patch', 'delete'])))))"
                  message: "a readOnly tool cannot create, update, patch or delete"
                - rule: "(has(self.destructive) && self.destructive) || !((has(self.kubernetes) && self.kubernetes.verb == 'delete') || (has(self.steps) && self.steps.exists(s, has(s.kubernetes) && s.kubernetes.verb == 'delete')) || (has(self.variants) && self.variants.options.exists(k, o, (has(o.kubernetes) && o.kubernetes.verb == 'delete') || (has(o.steps) && o.steps.exists(s, has(s.kubernetes) && s.kubernetes.verb == 'delete')))))"
                  message: "a tool that deletes must declare destructive: true"
              properties:
                toolset:
                  type: string
                  description: The ToolSet resource (family) this tool belongs to; its prefix, instructions, requires and identity apply.
                name:
                  type: string
                  description: MCP tool name. Defaults to metadata.name with '-' and '.' replaced by '_'.
                  pattern: '^[a-z0-9][a-z0-9_]*$'
                title:
                  type: string
                description:
                  type: string
                  description: Written for the model. First sentence what the tool does, second when to use it.
                  minLength: 1
                readOnly:
                  type: boolean
                destructive:
                  type: boolean
                idempotent:
                  type: boolean
                inputSchema:
                  type: object
                  description: JSON Schema (object) of the tool arguments.
                  x-kubernetes-preserve-unknown-fields: true
                output:
                  type: string
                  description: >-
                    CEL expression over `response` (decoded action response), `args`
                    (tool arguments) and `steps` (results of composed steps). Its result
                    replaces the raw response.
                requires:
                  type: array
                  description: API kinds the tool depends on; hidden when no target serves them (with target compatibility filters enabled).
                  items:
                    type: object
                    required: [apiVersion, kind]
                    properties:
                      apiVersion: {type: string}
                      kind: {type: string}
                meta:
                  type: object
                  description: Passed through as the MCP tool's _meta (client-side extensions such as UI renderers).
                  x-kubernetes-preserve-unknown-fields: true
                timeout:
                  type: string
                  pattern: ^([0-9]+(ms|s|m|h))+$
                  description: Bounds one call of the tool, every step included (default 60s).
                outputFull:
                  type: string
                  description: CEL projection behind the detail=full argument; output is the concise one.
                limit:
                  type: object
                  description: Output budget of a list-shaped result; adds the limit argument (and continue for a kubernetes list).
                  properties:
                    default: {type: integer, minimum: 1}
                    max: {type: integer, minimum: 1}
                    argument: {type: string}
                    field: {type: string, description: Key holding the list when the result is a map.}
                    narrowWith:
                      type: array
                      items: {type: string}
                kubernetes: &kubernetes
                  type: object
                  required: [verb, apiVersion]
                  x-kubernetes-validations:
                    - rule: "has(self.kind) != has(self.resource)"
                      message: "exactly one of kind or resource must be set"
                  properties:
                    verb:
                      type: string
                      enum: [get, list, create, update, patch, delete]
                    apiVersion:
                      type: string
                    kind:
                      type: string
                      description: Resolved to a resource through discovery.
                    resource:
                      type: string
                      description: The plural, bypassing discovery (aggregated APIs that only serve subresources).
                    namespaced:
                      type: boolean
                      description: Only with resource; defaults to true.
                    subresource:
                      description: A reference (string shorthand, or {argument|expression|value}); may have several segments.
                      x-kubernetes-preserve-unknown-fields: true
                    namespace:
                      type: object
                      properties:
                        argument: {type: string}
                        expression: {type: string}
                        value: {type: string}
                        all: {type: boolean}
                    name: &ref
                      description: A reference (string shorthand, or {argument|expression|value}).
                      x-kubernetes-preserve-unknown-fields: true
                    query:
                      type: object
                      additionalProperties: *ref
                    queryExpression:
                      type: string
                      description: CEL over args producing a map of query parameters.
                    body: &body
                      type: object
                      properties:
                        argument: {type: string}
                        expression: {type: string}
                        value:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                    response: &response
                      type: string
                      enum: [json, text, binary]
                      description: How the body is decoded. binary yields an image/blob content block.
                    mimeType: &mimeType
                      type: string
                      description: Media type of a binary response; takes precedence over the server's Content-Type.
                    redact: &redact
                      type: boolean
                      description: Remove secrets from a text response.
                http: &http
                  type: object
                  x-kubernetes-validations:
                    - rule: "[has(self.url), has(self.urlExpression), has(self.service)].filter(x, x).size() == 1"
                      message: "exactly one of url, urlExpression or service must be set"
                  properties:
                    method:
                      type: string
                    url:
                      type: string
                      pattern: '^https?://'
                    service:
                      type: object
                      required: [namespace, name]
                      properties:
                        namespace: {type: string}
                        name: {type: string}
                        port: {type: string}
                        scheme: {type: string, enum: [http, https]}
                    urlExpression:
                      type: string
                      description: CEL string over steps and item computing the base URL at run time (must not reference args).
                    path: *ref
                    query:
                      type: object
                      additionalProperties: *ref
                    queryExpression:
                      type: string
                    headers:
                      type: object
                      additionalProperties: *ref
                    body: *body
                    certificateAuthority:
                      type: string
                    insecureSkipTLSVerify:
                      type: boolean
                    response: *response
                    mimeType: *mimeType
                    redact: *redact
                steps: &steps
                  type: array
                  maxItems: 16
                  description: Composed actions, run in order; each sees the previous results as steps.<name>.
                  items:
                    type: object
                    required: [name]
                    x-kubernetes-validations:
                      - rule: "[has(self.kubernetes), has(self.http), has(self.expression), has(self.fail), has(self.elicit)].filter(x, x).size() == 1"
                        message: "exactly one of kubernetes, http, expression, fail or elicit must be set"
                    properties:
                      name:
                        type: string
                        pattern: '^[a-zA-Z_][a-zA-Z0-9_]*$'
                      kubernetes: *kubernetes
                      http: *http
                      expression:
                        type: string
                        description: A pure CEL step; its value is the result.
                      fail:
                        type: string
                        description: CEL string; a non-empty result fails the tool with that message.
                      elicit:
                        type: object
                        required: [message]
                        description: Ask the user through MCP elicitation; the result has action accept/decline/cancel/unsupported.
                        properties:
                          message:
                            type: string
                            description: Text template with ${expression} placeholders.
                      when:
                        type: string
                        description: CEL boolean; false skips the step (result null).
                      forEach:
                        type: string
                        description: CEL list; the action runs per element with `item` bound.
                      ignoreError:
                        type: boolean
                examples:
                  type: array
                  maxItems: 8
                  description: Example calls, rendered into the description in one fixed form and checked against the input schema.
                  items:
                    type: object
                    required: [summary]
                    properties:
                      summary:
                        type: string
                        minLength: 1
                        description: What the call does, in one line.
                      arguments:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                        description: The arguments of the call, as the model would send them.
                variants:
                  type: object
                  required: [argument, options]
                  description: One tool with modes; the argument selects which option runs and is added as an enum, required unless default is set.
                  properties:
                    argument:
                      type: string
                    description:
                      type: string
                    default:
                      type: string
                      description: The option that runs when the argument is omitted.
                    options:
                      type: object
                      minProperties: 1
                      maxProperties: 16
                      additionalProperties:
                        type: object
                        required: [description]
                        x-kubernetes-validations:
                          - rule: "[has(self.kubernetes), has(self.http), has(self.steps)].filter(x, x).size() == 1"
                            message: "exactly one of kubernetes, http or steps must be set"
                        properties:
                          description:
                            type: string
                            minLength: 1
                          kubernetes: *kubernetes
                          http: *http
                          steps: *steps
                          output:
                            type: string
---
# Prompt custom resource: optional gathering steps (the same engine as Tool,
# schema inlined because YAML anchors do not cross documents) followed by
# messages rendered from text templates with ${expression} placeholders over
# args and steps.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: prompts.tools.kubernetes-mcp-server.io
spec:
  group: tools.kubernetes-mcp-server.io
  scope: Cluster
  names:
    plural: prompts
    singular: prompt
    kind: Prompt
    shortNames:
    - mcpprompt
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Ready
      type: string
      jsonPath: .status.conditions[?(@.type=="Ready")].status
    - name: Reason
      type: string
      jsonPath: .status.conditions[?(@.type=="Ready")].reason
    - name: Prompt
      type: string
      jsonPath: .status.name
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    schema:
      openAPIV3Schema:
        type: object
        required:
        - spec
        properties:
          status:
            type: object
            description: "Written by the server: the MCP name the resource is exposed as, and a Ready condition saying what it did with the resource and why."
            properties:
              name:
                type: string
                description: The MCP name the resource is exposed as, when it is.
              conditions:
                type: array
                items:
                  type: object
                  required: [type, status]
                  properties:
                    type: {type: string}
                    status: {type: string, enum: ["True", "False", "Unknown"]}
                    reason: {type: string}
                    message: {type: string}
                    observedGeneration: {type: integer}
                    lastTransitionTime: {type: string}
          spec:
            type: object
            required:
            - description
            - messages
            properties:
              toolset:
                type: string
                description: The ToolSet resource (family) this prompt belongs to.
              name:
                type: string
                description: MCP prompt name. Defaults to metadata.name.
              title:
                type: string
              description:
                type: string
                minLength: 1
              timeout:
                type: string
                pattern: ^([0-9]+(ms|s|m|h))+$
                description: Bounds one call of the prompt, every step included (default 60s).
              arguments:
                type: array
                items:
                  type: object
                  required:
                  - name
                  properties:
                    name:
                      type: string
                    description:
                      type: string
                    required:
                      type: boolean
              steps:
                type: array
                maxItems: 16
                description: Composed actions, run in order; each sees the previous results as steps.<name>.
                items:
                  type: object
                  required:
                  - name
                  x-kubernetes-validations:
                  - rule: '[has(self.kubernetes), has(self.http), has(self.expression), has(self.fail),
                      has(self.elicit)].filter(x, x).size() == 1'
                    message: exactly one of kubernetes, http, expression, fail or elicit must be set
                  properties:
                    name:
                      type: string
                      pattern: ^[a-zA-Z_][a-zA-Z0-9_]*$
                    kubernetes:
                      type: object
                      required:
                      - verb
                      - apiVersion
                      x-kubernetes-validations:
                      - rule: has(self.kind) != has(self.resource)
                        message: exactly one of kind or resource must be set
                      properties:
                        verb:
                          type: string
                          enum:
                          - get
                          - list
                          - create
                          - update
                          - patch
                          - delete
                        apiVersion:
                          type: string
                        kind:
                          type: string
                          description: Resolved to a resource through discovery.
                        resource:
                          type: string
                          description: The plural, bypassing discovery (aggregated APIs that only serve
                            subresources).
                        namespaced:
                          type: boolean
                          description: Only with resource; defaults to true.
                        subresource:
                          description: A reference (string shorthand, or {argument|expression|value});
                            may have several segments.
                          x-kubernetes-preserve-unknown-fields: true
                        namespace:
                          type: object
                          properties:
                            argument:
                              type: string
                            expression:
                              type: string
                            value:
                              type: string
                            all:
                              type: boolean
                        name: &id001
                          description: A reference (string shorthand, or {argument|expression|value}).
                          x-kubernetes-preserve-unknown-fields: true
                        query:
                          type: object
                          additionalProperties: *id001
                        queryExpression:
                          type: string
                          description: CEL over args producing a map of query parameters.
                        body: &id002
                          type: object
                          properties:
                            argument:
                              type: string
                            expression:
                              type: string
                            value:
                              type: object
                              x-kubernetes-preserve-unknown-fields: true
                        response: &id003
                          type: string
                          enum:
                          - json
                          - text
                          - binary
                          description: How the body is decoded. binary yields an image/blob content block.
                        mimeType: &id004
                          type: string
                          description: Media type of a binary response; takes precedence over the server's Content-Type.
                        redact: &id005
                          type: boolean
                          description: Remove secrets from a text response.
                    http:
                      type: object
                      x-kubernetes-validations:
                      - rule: "[has(self.url), has(self.urlExpression), has(self.service)].filter(x, x).size() == 1"
                        message: exactly one of url, urlExpression or service must be set
                      properties:
                        method:
                          type: string
                        url:
                          type: string
                          pattern: ^https?://
                        urlExpression:
                          type: string
                          description: CEL string over steps and item computing the base URL at run time (must not reference args).
                        service:
                          type: object
                          required:
                          - namespace
                          - name
                          properties:
                            namespace:
                              type: string
                            name:
                              type: string
                            port:
                              type: string
                            scheme:
                              type: string
                              enum:
                              - http
                              - https
                        path: *id001
                        query:
                          type: object
                          additionalProperties: *id001
                        queryExpression:
                          type: string
                        headers:
                          type: object
                          additionalProperties: *id001
                        body: *id002
                        certificateAuthority:
                          type: string
                        insecureSkipTLSVerify:
                          type: boolean
                        response: *id003
                        mimeType: *id004
                        redact: *id005
                    expression:
                      type: string
                      description: A pure CEL step; its value is the result.
                    fail:
                      type: string
                      description: CEL string; a non-empty result fails the tool with that message.
                    elicit:
                      type: object
                      required:
                      - message
                      description: Ask the user through MCP elicitation; the result has action accept/decline/cancel/unsupported.
                      properties:
                        message:
                          type: string
                          description: Text template with ${expression} placeholders.
                    when:
                      type: string
                      description: CEL boolean; false skips the step (result null).
                    forEach:
                      type: string
                      description: CEL list; the action runs per element with `item` bound.
                    ignoreError:
                      type: boolean
              messages:
                type: array
                minItems: 1
                items:
                  type: object
                  required:
                  - role
                  - text
                  properties:
                    role:
                      type: string
                      enum:
                      - user
                      - assistant
                    text:
                      type: string
                      description: Template with ${expression} placeholders; structures render as YAML.
                    when:
                      type: string
                      description: CEL boolean; the message is dropped when false.
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: toolsets.tools.kubernetes-mcp-server.io
spec:
  group: tools.kubernetes-mcp-server.io
  scope: Cluster
  names:
    plural: toolsets
    singular: toolset
    kind: ToolSet
    shortNames: [ts]
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Ready
      type: string
      jsonPath: .status.conditions[?(@.type=="Ready")].status
    - name: Reason
      type: string
      jsonPath: .status.conditions[?(@.type=="Ready")].reason
    - name: Prefix
      type: string
      jsonPath: .spec.prefix
    - name: Identity
      type: string
      jsonPath: .spec.identity
    - name: Description
      type: string
      jsonPath: .spec.description
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    schema:
      openAPIV3Schema:
        type: object
        required: [spec]
        description: |
          A family of Tools and Prompts: the unit operators enable
          ("dynamic/<name>" in the toolsets configuration), the prefix every
          tool of the family is named with, the instructions contributed to
          the MCP server instructions, and the identity its http actions use.
        properties:
          status:
            type: object
            description: "Written by the server: a Ready condition saying what it did with the resource and why."
            properties:
              conditions:
                type: array
                items:
                  type: object
                  required: [type, status]
                  properties:
                    type: {type: string}
                    status: {type: string, enum: ["True", "False", "Unknown"]}
                    reason: {type: string}
                    message: {type: string}
                    observedGeneration: {type: integer}
                    lastTransitionTime: {type: string}
          spec:
            type: object
            required: [description]
            properties:
              description:
                type: string
                minLength: 1
                description: For operators and the toolsets listing.
              prefix:
                type: string
                pattern: ^[a-z0-9][a-z0-9_]*$
                description: Every tool of the family is named <prefix>_<something>.
              instructions:
                type: string
                description: Workflow guidance for the family, contributed once to the MCP server instructions.
              requires:
                type: array
                description: API kinds every tool of the family depends on (a tool may add its own).
                items:
                  type: object
                  required: [apiVersion, kind]
                  properties:
                    apiVersion: {type: string}
                    kind: {type: string}
              identity:
                type: string
                enum: [caller, server]
                description: What http actions of the family send; caller (default) or the server's own credentials.
