# Base URL of the Prometheus (or Thanos Querier) API. The MCP server calls it
# with the caller's bearer token ([toolset_configs.observability/metrics]
# prometheus_url).
url: https://thanos-querier.openshift-monitoring.svc:9091
# Base URL of the Alertmanager API (alertmanager_url). The get_alerts and
# get_silences tools are only installed when it is set.
alertmanagerUrl: ""
# Whose credentials the tools send to the backend: "caller" (the caller's
# bearer token, the default) or "server" (the server's own credentials, the
# former auth_mode = "kubeconfig"). Reported in every tool's RBAC metadata.
identity: caller
# PEM bundle used to verify the server certificates (empty: system roots).
certificateAuthority: ""
insecureSkipTLSVerify: false
# Return every sample of a range query instead of per-series summary
# statistics (range_query_full_response).
rangeQueryFullResponse: false

# Labels added to every Tool, Prompt and ToolSet the chart renders. Use them
# with the server's dynamic_tools_selector to say which installs a server
# serves (see charts/dynamic-tools/README.md).
extraLabels: {}
