apiVersion: v1
kind: Namespace
metadata:
  name: entra-mock
  labels:
    app.kubernetes.io/managed-by: e2e-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: entra-mock
  namespace: entra-mock
  labels:
    app: entra-mock
spec:
  replicas: 1
  selector:
    matchLabels:
      app: entra-mock
  template:
    metadata:
      labels:
        app: entra-mock
    spec:
      containers:
      - name: entra-mock
        image: localhost/entra-mock:e2e
        imagePullPolicy: IfNotPresent
        env:
        - name: ENTRA_MOCK_ISSUER_URL
          value: "http://entra-mock.entra-mock.svc.cluster.local:8080"
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /.well-known/openid-configuration
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: entra-mock
  namespace: entra-mock
  labels:
    app: entra-mock
spec:
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  selector:
    app: entra-mock
  type: ClusterIP
