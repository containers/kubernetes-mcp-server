# Allow e2e test namespaces to access Prometheus.
# The kube-prometheus stack installs deny-all NetworkPolicies in the monitoring
# namespace. The MCP server runs in a dynamically named namespace with the
# label app.kubernetes.io/managed-by=e2e-test (set by deployServer).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-e2e-to-prometheus
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: prometheus
      app.kubernetes.io/instance: k8s
      app.kubernetes.io/name: prometheus
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/managed-by: e2e-test
      ports:
        - protocol: TCP
          port: 9090
        - protocol: TCP
          port: 8080
---
# Allow e2e test namespaces to access Alertmanager.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-e2e-to-alertmanager
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: alert-router
      app.kubernetes.io/instance: main
      app.kubernetes.io/name: alertmanager
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/managed-by: e2e-test
      ports:
        - protocol: TCP
          port: 9093
        - protocol: TCP
          port: 8080
