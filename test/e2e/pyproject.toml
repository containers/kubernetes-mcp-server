[project]
name = "kubernetes-mcp-server-e2e"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "kubernetes-asyncio>=31.0,<37",
    "mcp>=1.28,<2",
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.25,<1",
    "pyyaml>=6.0,<7",
    "aiohttp>=3.9,<4",
    "httpx>=0.27,<1",
    "PyJWT>=2.8,<3",
    "cryptography>=42,<46",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
markers = [
    "kuadrant: tests requiring Kuadrant MCP Gateway (install with 'make kuadrant-setup')",
    "keycloak: tests requiring a running Keycloak instance",
    "entra: Entra ID (Azure AD) tests",
    "validation: startup config validation tests (binary only, no cluster needed)",
    "multicluster: tests requiring N>1 clusters (configurable provider strategy)",
]
