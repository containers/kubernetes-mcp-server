# Re-expose `configuration_view` over HTTP for the eval/CI environment.
#
# `enabled_tools` is an exclusive allowlist (pkg/config/config.go): once set, ANY
# tool not listed here is hidden, regardless of which toolsets are active. This
# file is copied into every mcpchecker.yaml matrix job that uses the default
# MCP_CONFIG_DIR, so the list below enumerates every tool across every toolset
# this project ships, not just the "core"/"config" ones, to avoid silently
# hiding tools in the helm/kiali/kubevirt/tekton/netobserv/all matrix jobs.
#
# This list is generated by TestEvalEnabledToolsAllowlist (pkg/mcp/toolsets_test.go)
# from the same toolset registry the server uses. To regenerate it after
# adding/renaming tools, run:
#
#   make test-update-snapshots
#
