# Re-expose `configuration_view` over HTTP for the eval/CI environment.
#
# `enabled_tools` is an exclusive allowlist (pkg/config/config.go): once set, ANY
# tool not listed here is hidden, regardless of which toolsets are active. This
# file is copied into every mcpchecker.yaml matrix job that uses the default
# MCP_CONFIG_DIR, so the list below enumerates every tool across every toolset
# this project ships, not just the "core"/"config" ones, to avoid silently
# hiding tools in the helm/kiali/kubevirt/tekton/netobserv/all matrix jobs.
#
# This list was generated from the running binary. To regenerate it after adding/renaming tools:
#
#   make build
#   printf 'toolsets = ["core","config","helm","kiali","kubevirt","tekton","netobserv","kcp"]\n' > /tmp/all-toolsets.toml
#   (echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"probe","version":"1"}}}'; \
#    sleep 1; echo '{"jsonrpc":"2.0","method":"notifications/initialized"}'; \
#    sleep 1; echo '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'; sleep 2) \
#     | KUBECONFIG=<any-valid-kubeconfig> ./kubernetes-mcp-server --config /tmp/all-toolsets.toml \
#     | python3 -c "import json,sys;[print(t['name']) for t in [json.loads(l) for l in sys.stdin if l.strip()][-1]['result']['tools']]" | sort

enabled_tools = [
  "configuration_view",
  "events_list",
  "helm_install",
  "helm_list",
