# Local Korrel8r eval backend (see evals/tasks/korrel8r/README.md).
# The backend uses --unsafe-shared-session: localhost port-forward ONLY.
# The eval cluster has no connected OpenShift console session.
disabled_tools = ["korrel8r_get_console", "korrel8r_show_in_console"]

[toolset_configs."observability/korrel8r"]
url = "http://127.0.0.1:18080"
auth_mode = "kubeconfig"
